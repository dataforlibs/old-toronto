    <div style="font-family: Georgia, serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #222;">
      <h1>Old Toronto · Historical Itinerary Planner</h1>
      <p>
        Explore Toronto's history through 37,000+ archival photographs from the
        Toronto Public Library and City of Toronto Archives. Generate walking
        routes through 12 historical eras — from the 1850s to the 1970s — and
        discover how neighbourhoods like Cabbagetown, the Annex, and the
        Waterfront have transformed over 150 years.
      </p>
      <p>
        Select a starting point, choose a historical era, and follow a
        street-level route connecting geocoded archival images. Each stop links
        to original digitized photographs showing the same location across
        different decades.
      </p>
      <p>
        This application requires JavaScript to run. Please enable JavaScript
        in your browser to use the interactive map and photo explorer.
      </p>
      <p>
        Built by <a href="https://dataforlibs.github.io/">Olha Buchel</a> ·
        Data from Toronto Public Library and City of Toronto Archives.
      </p>
